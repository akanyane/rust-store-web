<html>

<body>
<x-dc>
<helmet><link rel="stylesheet" href="./tokens.css"></helmet>
<footer style="border-top:1px solid var(--border);background:var(--surface-2);display:flex;justify-content:center">
  <div style="width:100%;max-width:1120px;padding:14px 32px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between">
    <div role="note" style="display:flex;align-items:center;gap:8px;font:500 12.5px var(--font-sans);color:var(--text-2)"><span style="display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--text);color:var(--bg);font:600 10.5px var(--font-mono);letter-spacing:.06em">DEMO</span>Demo store: payments are simulated</div>
    <span style="font:400 12px var(--font-sans);color:var(--text-3)">Prices in unidades · No real money</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:52}}"></script>
</body>
