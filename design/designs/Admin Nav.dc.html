<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./tokens.css"></helmet>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Admin" style="width:232px;height:100%;min-height:100%;box-sizing:border-box;background:var(--admin-bar);color:var(--admin-bar-text);padding:20px 14px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;align-items:center;gap:10px;padding:0 6px"><span style="width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 14px var(--font-sans)">R</span><div style="display:flex;flex-direction:column"><span style="font:600 15px var(--font-sans)">Rust Store</span><span style="font:600 10.5px var(--font-mono);letter-spacing:.08em;color:var(--admin-bar-muted)">ADMIN CONSOLE</span></div></div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="2">
      <a href="#" aria-current="{{ l.current }}" style="height:38px;padding:0 10px;display:flex;align-items:center;gap:10px;border-radius:8px;text-decoration:none;font:{{ l.font }};color:{{ l.color }};background:{{ l.bg }}">{{ l.icon }}{{ l.label }}</a>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px">
    <a href="#" style="height:36px;padding:0 10px;display:flex;align-items:center;border-radius:8px;text-decoration:none;font:500 13.5px var(--font-sans);color:var(--admin-bar-muted)">View storefront ↗</a>
    <a href="#" style="height:36px;padding:0 10px;display:flex;align-items:center;border-radius:8px;text-decoration:none;font:500 13.5px var(--font-sans);color:var(--admin-bar-muted)">Sign out</a>
  </div>
</nav>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<div style="background:var(--admin-bar);color:var(--admin-bar-text)">
  <div style="height:52px;display:flex;align-items:center;gap:10px;padding:0 16px"><span style="width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-sans)">R</span><span style="font:600 15px var(--font-sans);flex:1">Admin</span><a href="#" style="font:500 13px var(--font-sans);color:var(--admin-bar-muted);text-decoration:none">Storefront ↗</a></div>
  <nav aria-label="Admin" style="display:flex;padding:0 8px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="2">
      <a href="#" aria-current="{{ l.current }}" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:{{ l.font }};color:{{ l.color }};box-shadow:inset 0 -2px 0 {{ l.bar }}">{{ l.icon }}{{ l.label }}</a>
    </sc-for>
  </nav>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:600},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;orders&quot;,&quot;products&quot;],&quot;default&quot;:&quot;orders&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const active = this.props.active ?? 'orders';
    const svg = (d) => h('svg', { width: 16, height: 16, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true }, d.map((x, i) => h('path', { key: i, d: x })));
    const mk = (k, label, icon) => { const on = active === k; return { label, icon, current: on ? 'page' : undefined, font: on ? '600 14px var(--font-sans)' : '500 14px var(--font-sans)', color: on ? 'var(--admin-bar-text)' : 'var(--admin-bar-muted)', bg: on ? 'rgba(255,255,255,.1)' : 'transparent', bar: on ? 'var(--accent)' : 'transparent' }; };
    return {
      isDesktop: !this.props.mobile, isMobile: !!this.props.mobile,
      links: [mk('orders', 'Orders', svg(['M3 2.5h10v11H3z', 'M5.5 5.5h5M5.5 8h5M5.5 10.5h3'])), mk('products', 'Products', svg(['M2.5 5L8 2.5 13.5 5v6L8 13.5 2.5 11z', 'M2.5 5L8 7.5 13.5 5', 'M8 7.5v6']))],
    };
  }
}
</script>
</body>
</html>
