<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./tokens.css"></helmet>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
<header style="height:64px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:center">
  <div style="width:100%;max-width:1120px;padding:0 32px;display:flex;align-items:center;gap:32px">
    <a href="#" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)"><span style="width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 14px var(--font-sans)">R</span><span style="font:600 17px var(--font-sans);letter-spacing:-.01em">Rust Store</span></a>
    <nav aria-label="Main" style="display:flex;gap:4px;flex:1">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="2">
        <a href="#" aria-current="{{ l.current }}" style="height:36px;padding:0 12px;display:flex;align-items:center;border-radius:8px;text-decoration:none;font:{{ l.font }};color:{{ l.color }};background:{{ l.bg }}">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:8px">
      <a href="#" style="height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none;color:var(--text);font:{{ cartFont }};background:{{ cartBg }}">{{ icCart }}Cart<span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--text);color:var(--bg);font:600 11.5px var(--font-sans);display:flex;align-items:center;justify-content:center">{{ cartCount }}</span></a>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ true }}">
        <a href="#" style="height:36px;padding:0 12px 0 6px;display:flex;align-items:center;gap:8px;border-radius:8px;text-decoration:none;color:var(--text);font:{{ acctFont }};background:{{ acctBg }}"><span style="width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font:600 11px var(--font-sans)">{{ initials }}</span>My account</a>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ false }}">
        <a href="#" style="height:36px;padding:0 14px;display:flex;align-items:center;border-radius:8px;text-decoration:none;color:var(--text);font:600 14px var(--font-sans);border:1px solid var(--border-strong)">Sign in</a>
      </sc-if>
    </div>
  </div>
</header>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
<header style="height:56px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;padding:0 8px 0 16px;gap:4px">
  <a href="#" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);flex:1"><span style="width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-sans)">R</span><span style="font:600 16px var(--font-sans)">Rust Store</span></a>
  <a href="#" aria-label="Cart, {{ cartCount }} items" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text);position:relative">{{ icCart }}<span style="position:absolute;top:6px;right:4px;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 10px var(--font-sans);display:flex;align-items:center;justify-content:center">{{ cartCount }}</span></a>
  <button aria-label="Menu" style="width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center">{{ icMenu }}</button>
</header>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;catalog&quot;,&quot;orders&quot;,&quot;cart&quot;,&quot;account&quot;,&quot;none&quot;],&quot;default&quot;:&quot;catalog&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cart&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MC&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const p = this.props;
    const active = p.active ?? 'catalog';
    const svg = (d) => h('svg', { width: 20, height: 20, viewBox: '0 0 20 20', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true }, d.map((x, i) => h('path', { key: i, d: x })));
    const on = (k) => active === k;
    const st = (k) => ({ font: on(k) ? '600 14px var(--font-sans)' : '500 14px var(--font-sans)', color: on(k) ? 'var(--text)' : 'var(--text-2)', bg: on(k) ? 'var(--surface-2)' : 'transparent', current: on(k) ? 'page' : undefined });
    const signedIn = p.signedIn ?? true;
    return {
      isDesktop: !p.mobile, isMobile: !!p.mobile,
      links: [{ label: 'Catalog', ...st('catalog') }, ...(signedIn ? [{ label: 'Orders', ...st('orders') }] : [])],
      cartFont: st('cart').font, cartBg: st('cart').bg,
      acctFont: st('account').font, acctBg: st('account').bg,
      cartCount: p.cart ?? 0, signedIn, signedOut: !signedIn, initials: p.initials ?? 'MC',
      icCart: svg(['M2.5 3.5h2l1.8 9h9l1.7-6.5H6', 'M8 16.5h.1M14.5 16.5h.1']),
      icMenu: svg(['M3.5 6h13M3.5 10h13M3.5 14h13']),
    };
  }
}
</script>
</body>
</html>
